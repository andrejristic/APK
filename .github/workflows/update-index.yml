name: update-apk-index

# Every hour (and on demand: Actions -> update-apk-index -> Run workflow) the README
# is rebuilt with links to every .apk released in a public andrejristic repository.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: apk-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update APK index"
          git push
